global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "user-service"
    static_configs:
      - targets: ["user-service:4000"]

  - job_name: "order-service"
    static_configs:
      - targets: ["order-service:5000"]

  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:3000"]