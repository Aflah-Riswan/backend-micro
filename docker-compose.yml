services:

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    environment:
      PORT: 4000
      DATABASE_URL: mongodb://mongodb:27017/users
      ACCESS_TOKEN_SECRET: your_access_secret
    ports:
      - "4000:4000"
      - "5001:5001"
    depends_on:
      - mongodb

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orders
      ACCESS_TOKEN_SECRET: your_access_secret
      USER_SERVICE_GRPC_URL: user-service:5001
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - user-service

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    environment:
      PORT: 3000
      ACCESS_TOKEN_SECRET: your_access_secret
      USER_SERVICE_URL: http://user-service:4000
      ORDER_SERVICE_URL: http://order-service:5000
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - order-service

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - user-service
      - order-service
      - api-gateway

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  mongo_data:
  postgres_data: