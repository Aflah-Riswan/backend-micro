name: Microservices CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - order-service

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }} \
            ./${{ matrix.service }}

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}


  deploy:

    needs: build-and-push

    runs-on: self-hosted

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Kubernetes connection
        run: kubectl cluster-info

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/

          kubectl set image deployment/api-gateway \
            api-gateway=${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:${{ github.sha }}

          kubectl set image deployment/user-service \
            user-service=${{ secrets.DOCKERHUB_USERNAME }}/user-service:${{ github.sha }}

          kubectl set image deployment/order-service \
            order-service=${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }}

      - name: Wait for API Gateway rollout
        run: kubectl rollout status deployment/api-gateway

      - name: Wait for User Service rollout
        run: kubectl rollout status deployment/user-service

      - name: Wait for Order Service rollout
        run: kubectl rollout status deployment/order-service

      - name: Rollback deployments
        if: failure()
        run: |
          kubectl rollout undo deployment/api-gateway || true
          kubectl rollout undo deployment/user-service || true
          kubectl rollout undo deployment/order-service || true