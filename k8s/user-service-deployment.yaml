apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: module-33-user-service:latest

          ports:
            - containerPort: 4000

            # gRPC
            - containerPort: 5001

          env:
            - name: PORT
              value: "4000"

            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: microservices-secret
                  key: ACCESS_TOKEN_SECRET

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: microservices-secret
                  key: MONGODB_URI