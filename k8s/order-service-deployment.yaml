apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: module-33-order-service:latest

          ports:
            - containerPort: 5000

          env:
            - name: PORT
              value: "5000"

            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: microservices-secret
                  key: ACCESS_TOKEN_SECRET

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: microservices-secret
                  key: POSTGRESQL_URI

            - name: USER_SERVICE_GRPC_URL
              value: "user-service:5001"