apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: module-33-api-gateway:latest

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: microservices-secret
                  key: ACCESS_TOKEN_SECRET

            - name: USER_SERVICE_URL
              value: "http://user-service:4000"

            - name: ORDER_SERVICE_URL
              value: "http://order-service:5000"